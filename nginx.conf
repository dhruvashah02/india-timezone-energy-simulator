events { worker_connections 1024; }

http {
    upstream backend_cluster {
        server api_worker_1:8000;
        server api_worker_2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}