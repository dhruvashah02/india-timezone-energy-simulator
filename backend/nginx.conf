events { worker_connections 1024; }

http {
    upstream backend_cluster {
        # These parameters tell Nginx to instantly drop a dead worker and route to the healthy one
        server api_worker_1:8000 max_fails=1 fail_timeout=10s;
        server api_worker_2:8000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}