version: '3.8'

services:
  nginx_lb:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_worker_1
      - api_worker_2

  api_worker_1:
    build: ./backend
    container_name: api_worker_1
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  api_worker_2:
    build: ./backend
    container_name: api_worker_2
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  streamlit_frontend:
    build: .
    container_name: streamlit_frontend
    ports:
      - "8501:8501"
    volumes:
      - .:/app  # <-- This maps your local files instantly into the container
    environment:
      - BACKEND_URL=http://nginx_lb
    depends_on:
      - nginx_lb